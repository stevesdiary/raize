<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    
    @keyframes sweepGlow {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
      100% { transform: translateX(300%); }
    }
    
    @keyframes pulseAura {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }

    @keyframes telemetryBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .animate-sweep {
      animation: sweepGlow 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .animate-aura {
      animation: pulseAura 4s ease-in-out infinite;
    }

    .animate-telemetry {
      animation: telemetryBlink 1.8s ease-in-out infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-container-lowest text-on-surface antialiased select-none flex items-center justify-center min-h-screen p-0 sm:p-6 overflow-hidden">
<!-- Mobile Device Simulation Frame (iPhone 15 Pro Dimensions: 390px x 844px) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#07090E] rounded-[52px] border border-outline-variant/30 shadow-[0_25px_60px_rgba(0,0,0,0.9)] overflow-hidden flex flex-col justify-between">

</div>
<!-- Top Status Bar & iOS Dynamic Island -->

<div class="w-full flex justify-between items-center text-[14px] font-semibold text-on-surface tracking-tight">

<span class="font-body-md text-on-surface text-xs font-semibold pl-1">09:41</span>
<!-- Hardware Dynamic Island -->
<div class="w-[124px] h-[35px] bg-[#000000] rounded-full border border-white/5 flex items-center justify-between px-3 shadow-inner">
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-lowest border border-white/10 flex items-center justify-center">
<span class="w-1 h-1 rounded-full bg-secondary"></span>
</div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-lowest border border-white/5"></div>
</div>
<!-- iOS Status Icons -->
<div class="flex items-center space-x-1.5 text-on-surface/90 pr-0.5">
<span class="material-symbols-outlined text-[15px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[18px]" data-icon="battery_full">battery_full</span>
</div>
</div>
</header>

<div class="relative w-32 h-32 flex items-center justify-center mb-8">

<defs>
<lineargradient gradientunits="userSpaceOnUse" id="primaryFlow" x1="8" x2="56" y1="8" y2="56">

<stop offset="55%" stop-color="#8083FF"></stop>
<stop offset="100%" stop-color="#4EDEA3"></stop>

<stop offset="100%" stop-color="#00A572"></stop>
</lineargradient>
