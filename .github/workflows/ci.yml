name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Fastify, Drizzle & Vitest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_wRShFUkaxicemLWVTrt1
          POSTGRES_DB: raize_fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:dev_wRShFUkaxicemLWVTrt1@localhost:5432/raize_fitness
          NODE_ENV: test
        run: pnpm db:migrate

      - name: Seed Database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:dev_wRShFUkaxicemLWVTrt1@localhost:5432/raize_fitness
          NODE_ENV: test
        run: pnpm db:seed

      - name: Typecheck & Build Backend
        working-directory: ./backend
        run: pnpm build

      - name: Run Vitest Suite (38 Tests)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:dev_wRShFUkaxicemLWVTrt1@localhost:5432/raize_fitness
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: super_secret_jwt_passphrase_for_fitness_platform_2026_min_32_chars!
        run: pnpm test

  mobile-ci:
    name: Mobile CI (Flutter Analyze, Test & APK Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests (63 Tests)
        working-directory: ./mobile
        run: flutter test

      - name: Build Android Debug APK
        working-directory: ./mobile
        run: flutter build apk --debug
